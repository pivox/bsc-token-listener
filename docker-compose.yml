services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bscbot
      POSTGRES_USER: bscbot
      POSTGRES_PASSWORD: bscbot
    ports:
      - "5432:5432"
    volumes:
      - bscbot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bscbot -d bscbot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bscbot_postgres:
